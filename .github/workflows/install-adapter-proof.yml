name: Windows install adapter proof

# This workflow is intentionally dispatch-only: it exercises one explicitly
# allowlisted adapter on a disposable cloud runner and must never run as a side
# effect of a push.
on:
  workflow_dispatch:
    inputs:
      app_id:
        description: 'Reviewed clean-Windows adapter proof target'
        required: true
        type: choice
        options:
          - dim-sum-atlas
          - winforge
          - wimforge
          - qbittorrent-material

permissions:
  contents: read

jobs:
  proof:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Record cloud runner inventory
        shell: pwsh
        run: |
          "Runner OS: $env:RUNNER_OS"
          "Runner architecture: $env:RUNNER_ARCH"
          node --version
          npm --version
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') { throw 'The proof requires a Windows X64 cloud runner.' }
      - name: Install locked dependencies from a cache-miss-safe state
        run: npm ci
      - name: Build the reviewed main process and preload
        run: npm run build
      - name: Run one selected adapter proof
        timeout-minutes: 25
        shell: pwsh
        env:
          PROOF_APP_ID: ${{ inputs.app_id }}
        run: |
          New-Item -ItemType Directory -Path proof-output -Force | Out-Null
          npx electron scripts/prove-install-adapter.mjs `
            --app-id $env:PROOF_APP_ID `
            --output (Join-Path $env:GITHUB_WORKSPACE 'proof-output/install-proof.json') `
            --data-root (Join-Path $env:RUNNER_TEMP 'ding-ding-install-proof-data')
      - name: Validate proof manifest boundary
        if: always()
        shell: pwsh
        env:
          PROOF_APP_ID: ${{ inputs.app_id }}
        run: |
          if (-not (Test-Path -LiteralPath proof-output/install-proof.json)) { throw 'The install proof did not emit its bounded manifest.' }
          $proof = Get-Content -LiteralPath proof-output/install-proof.json -Raw | ConvertFrom-Json
          if ($proof.schemaVersion -ne 'ding-ding-app-store.install-proof.v1') { throw 'Unexpected proof schema.' }
          if ($proof.appId -ne $env:PROOF_APP_ID) { throw 'The proof app ID does not match the selected dispatch target.' }
          if ($proof.sourceRuntimeInvoked -ne $false) { throw 'The install proof must never invoke source or OpenCode runtime.' }
          if ($proof.runner.image -ne 'windows-2022') { throw 'The proof did not record the pinned cloud image.' }
          if ($proof.integrity.downloadVerification -ne 'operation-service-sha256') { throw 'The proof did not record SHA-256 download verification.' }
          if ($proof.integrity.assetName -notmatch '^[A-Za-z0-9][A-Za-z0-9._+-]{0,255}$') { throw 'The proof recorded an invalid bounded asset name.' }
          if ($proof.integrity.assetBytes -le 0) { throw 'The proof did not record a positive installer byte count.' }
          if ($proof.integrity.downloadCompleted -ne $true -or $proof.integrity.sha256Verified -ne $true) { throw 'The selected installer did not complete the OperationService SHA-256 path.' }
          if ($proof.matchedAfterInstall -ne $true) { throw 'The exact App Store-owned installed record was not rediscovered.' }
          if ($proof.cleanup.attempted -ne $true -or $proof.cleanup.ok -ne $true) { throw 'The reviewed uninstall route did not complete.' }
          if (@($proof.afterCleanup).Count -ne 0 -or @($proof.persistedAfterCleanup).Count -ne 0) { throw 'Cleanup left a detected or persisted target record.' }
          if ($env:PROOF_APP_ID -eq 'qbittorrent-material') {
            if ($proof.family -ne 'squirrel' -or $proof.target.ownershipKind -ne 'registry' -or $proof.target.uninstallKind -ne 'squirrel') { throw 'The non-portable proof target contract drifted.' }
            if ($proof.cleanStart -ne $true -or @($proof.before).Count -ne 0) { throw 'The Squirrel proof did not start from a clean target state.' }
            if ($proof.integrity.expectedSha256 -notmatch '^[0-9a-f]{64}$') { throw 'The Squirrel proof did not bind the installer to a direct GitHub SHA-256 digest.' }
            if ($proof.integrity.releaseMatchedResult -ne $true) { throw 'The installed result did not match the release tag resolved for SHA-256 evidence.' }
          }
          if ($proof.verdict -ne $true) { throw 'The selected adapter proof did not reach its expected verdict.' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-adapter-proof-${{ inputs.app_id }}-${{ github.run_id }}
          path: proof-output/install-proof.json
          if-no-files-found: ignore
